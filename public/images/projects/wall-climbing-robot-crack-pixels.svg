    <path id="trace" d="M78 0h26v52h26v26h26v26h26v26h26v52h26v26h26v52h-26v-26h-26v-26h-26v-52h-26v-26h-26v-26h-26V78H78Z M130 104h-26v26H78v26H52v26H26v26h26v-26h26v-26h26v-26h26Z"/>
  </defs>
  <rect width="900" height="400" fill="#f5f8f7"/>
